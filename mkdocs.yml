site_name: CiviCRM Modifications
site_description: Adjustments for proVeg Germany
site_author: SYSTOPIA
repo_url: https://github.com/systopia/com.proveg.mods

theme:
  name: material

nav:
  - Introduction: index.md

markdown_extensions:
  - attr_list
  - admonition
  - def_list
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tilde
  - pymdownx.betterem
  - pymdownx.mark

plugins:
  - search:
      lang: en
